 <linearGradient id="sari" x2="1" y2="1"><stop stop-color="#f9db79"/><stop offset=".48" stop-color="#bb172c"/><stop offset="1" stop-color="#600d26"/></linearGradient>
 <linearGradient id="whiteSari" x2="1" y2="1"><stop stop-color="#fffdf2"/><stop offset=".55" stop-color="#dfecf5"/><stop offset="1" stop-color="#c7a64e"/></linearGradient>
