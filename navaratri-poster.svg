<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1824" viewBox="0 0 1400 1824">
<defs>
 <linearGradient id="paper" x2="0" y2="1"><stop stop-color="#c3e2f8"/><stop offset="1" stop-color="#a6d1ee"/></linearGradient>
