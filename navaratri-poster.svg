<!-- lower title and schedule -->
<g font-family="Kartika,'Noto Sans Malayalam',sans-serif" text-anchor="middle">
 <text x="700" y="1190" fill="url(#gold)" font-size="67" font-weight="bold">നവരാത്രി മഹോത്സവം</text>
 <text x="700" y="1238" fill="#fff5da" font-size="27">2026 - ഒക്ടോബർ 18, 19, 20, 21</text>
 <text x="700" y="1276" fill="#e9c66b" font-size="24">1202 - തുലാം - 1, 2, 3, 4</text>
</g>
<!-- four event panels -->
<g fill="#06284a" fill-opacity=".94" stroke="#e2bd68" stroke-width="2">
 <rect x="135" y="1300" width="545" height="132" rx="8"/><rect x="720" y="1300" width="545" height="132" rx="8"/>
 <rect x="135" y="1446" width="545" height="155" rx="8"/><rect x="720" y="1446" width="545" height="155" rx="8"/>
</g>
<g font-family="Kartika,'Noto Sans Malayalam',sans-serif" text-anchor="middle">
 <text x="407" y="1340" fill="#f1cd72" font-size="24" font-weight="bold">2026 ഒക്ടോബർ-18 ഞായർ</text><text x="407" y="1387" fill="#fff" font-size="24">വൈകീട്ട്: ഗ്രന്ഥംവെപ്പ്</text>
 <text x="992" y="1340" fill="#f1cd72" font-size="24" font-weight="bold">2026 ഒക്ടോബർ-19 തിങ്കൾ</text><text x="992" y="1387" fill="#fff" font-size="27">വിശേഷാൽ പൂജ</text>
 <text x="407" y="1483" fill="#f1cd72" font-size="27" font-weight="bold">മഹാനവമി</text><text x="407" y="1522" fill="#fff" font-size="23">ഒക്ടോബർ 20 ചൊവ്വ</text><text x="407" y="1561" fill="#fff" font-size="22">വിശേഷാൽ പൂജ,  ഗ്രന്ഥ പൂജ,  വൈകീട്ട്: വാഹനപൂജ</text>
 <text x="992" y="1483" fill="#f1cd72" font-size="27" font-weight="bold">വിജയദശമി</text><text x="992" y="1522" fill="#fff" font-size="23">ഒക്ടോബർ 21 ബുധൻ</text><text x="992" y="1558" fill="#fff" font-size="21">വിശേഷാൽ പൂജ, ഗ്രന്ഥം എഴുന്നൽപ്പ്,</text><text x="992" y="1588" fill="#fff" font-size="21">വാഹന പൂജ, വിദ്യാരംഭം</text>
 <text x="700" y="1640" fill="#fff3d2" font-size="23">NB: വിദ്യാരംഭത്തിന് മുൻകൂട്ടി ബുക്ക് ചെയ്യുക.</text><text x="700" y="1680" fill="#e9c66b" font-size="25" font-weight="bold">ക്ഷേത്രകമ്മിറ്റി.</text>
</g>
</svg>

